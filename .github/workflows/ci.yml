name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: selftest (offline, fixtures only)
        run: npm test
      - name: demo smoke (offline)
        run: node bin/mcd.js --demo --json > /dev/null && echo "demo ok"
